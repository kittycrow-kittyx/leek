name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate compiler
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun run setup
      - name: Strict Code Guards
        run: bun run guards
      - name: Type-check source
        run: bun run check
      - name: Cross-repository reuse
        run: bun run guards:reuse
      - name: Upload Code Guards report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: leek-code-guards
          path: logs/code-guards*.json
          if-no-files-found: ignore
      - name: Unit tests
        run: bun run test
