name: Transpiler validation

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORT_DISABLE_TELEMETRY: '1'

jobs:
  validate:
    name: Validate transpiler
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun run setup
      - name: Strict Code Guards
        run: bun run guards
      - name: Type-check transpiler
        run: bun run check
      - name: Validate cross-repository reuse
        run: bun run guards:reuse
      - name: Upload Code Guards report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: leek-code-guards
          path: logs/code-guards*.json
          if-no-files-found: ignore
      - name: Test transpiler
        run: bun run test
      - name: Canonical mikuOS transpilation diagnostic
        run: |
          set +e
          bun src/cli.ts --target=wasm --source ./mikuOS-thistle --out-dir ./build/canonical-attempt > canonical-transpilation.log 2>&1
          status=$?
          cat canonical-transpilation.log
          echo "Canonical transpilation exit status: $status"
          exit 0
      - name: Upload canonical transpilation diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-mikuos-diagnostics
          path: |
            canonical-transpilation.log
            build/wasm/**/bake-report.json
          if-no-files-found: ignore
